# sys-compliance-db-api - LOCAL (Anypoint Studio)
http:
  port: "8083"

api:
  id: "0"            # local: autodiscovery inactive (run with -Danypoint.platform.gatekeeper=disabled)

db:
  host: "gateway01.ap-southeast-1.prod.aws.tidbcloud.com"
  port: "4000"
  name: "compliance"
  sslMode: "VERIFY_IDENTITY"
  fetchSize: "500"
  pool:
    max: "5"
  reconnect:
    frequencyMs: "2000"
    attempts: "3"

flags:
  pageSize: "500"

report:
  defaultType: "STR"
  defaultEntity: "ENT0091"
  missingCustomer:
    name: "UNKNOWN_CUSTOMER"
    type: "UNKNOWN"
