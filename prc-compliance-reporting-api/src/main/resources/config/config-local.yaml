# prc-compliance-reporting-api - LOCAL (Anypoint Studio)
http:
  port: "8082"
api:
  id: "0"

# ---- system APIs (running locally in Studio) ----
sysDb:
  host: "localhost"
  port: "8083"
  protocol: "HTTP"
  basePath: "/api"
  timeoutMs: "60000"
  retries: "2"
  retryDelayMs: "2000"
sysNotification:
  host: "localhost"
  port: "8084"
  protocol: "HTTP"
  basePath: "/api"
  timeoutMs: "120000"

# ---- FR1: nightly run after the 21:00 IST business-day cutoff ----
schedule:
  cron: "0 30 21 * * ?"
  timeZone: "Asia/Kolkata"
sentinel:
  frequencyMinutes: "60"
runLock:
  ttlMinutes: "60"

# ---- report definition ----
report:
  type: "STR"
  entityCode: "ENT0091"
  entityName: "Bright Financial Services Ltd"
  currency: "INR"
  cutoffTime: "21:00:00"
  maxCatchUpPeriods: "7"
  maxAmount: "99999999999.99"
  missingCustomerPolicy: "PLACEHOLDER"   # PLACEHOLDER | FAIL  (NS 9)
flags:
  pageSize: "500"

# ---- FR11 volume deviation ----
deviation:
  window: "7"
  minHistory: "3"
  thresholdPercent: "50"

# ---- files (outside the Git repo) ----
file:
  workingDir: "C:/MuleWorkspace/compliance-files"
  outputDir: "output"
  archiveDir: "archive"
  reproduceDir: "reproduce"

# ---- FR12 delivery ----
email:
  maxAttachmentBytes: "3000000"
secureLink:
  baseUrl: "http://localhost:8081"
  validHours: "24"

# ---- advisory AI briefing (OpenAI-compatible endpoint) ----
ai:
  enabled: "true"
  host: "api.groq.com"
  path: "/openai/v1/chat/completions"
  model: "llama-3.3-70b-versatile"
  timeoutMs: "15000"
